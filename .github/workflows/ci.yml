name: CI

on:
  push:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js baseline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Lint module boundaries
        run: npm run lint

      # The contract gate runs first and on its own: schema, policy, API and
      # evaluation contracts must hold with no model and no live source, so a
      # failure here says the contracts broke, not that a dependency was down.
      - name: Contract tests (no model, no live source)
        run: npm run test:contract

      - name: Run tests
        run: npm test

      - name: Ingest validate runs offline
        run: npm run ingest:validate fixtures/fixture-source-pack.json

      - name: Verify project contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/01-project-plan.md
          test -f docs/02-system-analysis.md
          test -f docs/03-system-design.md
          git diff --check

      - name: Verify local handoff is not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch artifacts/session-summaries/Progress.md >/dev/null 2>&1; then
            echo "Progress.md must remain a local ignored handoff file."
            exit 1
          fi
